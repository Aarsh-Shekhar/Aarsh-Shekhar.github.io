<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photography - Aarsh Shekhar</title>
  <meta name="description" content="A gallery of field photos, research moments, and travel frames." />
  <meta name="color-scheme" content="dark light" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../css/photography.css" />
</head>
<body>
  <div class="photo-page">
    <header class="topbar">
      <a class="brand" href="../index.html">aarsh/photography</a>
      <nav class="topnav" aria-label="Photography navigation">
        <a class="is-active" href="../photography/">Gallery</a>
        <a href="../photography/gear/">Gear</a>
        <span>›</span>
      </nav>
      <div class="quick-actions">
        <button type="button" aria-label="Open command palette" data-command-toggle>⌘</button>
        <button type="button" aria-label="Toggle theme" data-theme-toggle>☀</button>
        <button type="button" aria-label="Open menu" data-menu-toggle>☰</button>
      </div>
    </header>

    <main class="photo-shell">
      <section class="gallery-toolbar" aria-label="Gallery controls">
        <p class="photo-count" data-photo-count>15 photos</p>
        <div class="gallery-controls">
          <button type="button" aria-label="Search photos" data-search-toggle>⌕</button>
          <span aria-hidden="true">|</span>
          <button class="is-active" type="button" data-filter="Gallery">Gallery</button>
          <button type="button" data-filter="Location">Location</button>
          <button type="button" data-filter="Camera">Camera</button>
          <button type="button" data-filter="Tags">Tags</button>
          <button class="icon-button is-active" type="button" aria-label="Large grid" data-layout-large>▦</button>
          <button class="icon-button" type="button" aria-label="Compact grid" data-layout-small>▪▪</button>
          <button type="button" aria-label="Reverse sort" data-sort>↕</button>
        </div>
      </section>

      <div class="gallery-search" data-gallery-search>
        <input type="search" placeholder="Search by place, tag, camera..." data-search-input />
      </div>

      <section class="photo-grid" data-photo-grid aria-label="Photo gallery"></section>
    </main>

    <footer class="site-footer">
      <div class="footer-line">(o_ &nbsp; (o_ &nbsp; (/)_</div>
      <div class="footer-icons">
        <a href="https://github.com/Aarsh-Shekhar" target="_blank" rel="noopener noreferrer">GH</a>
        <a href="https://scholar.google.com/citations?user=h3AGhvAAAAAJ&hl=en" target="_blank" rel="noopener noreferrer">GS</a>
        <a href="https://www.linkedin.com/in/aarsh-shekhar" target="_blank" rel="noopener noreferrer">in</a>
      </div>
      <p>Aarsh Shekhar © 2026 • Have a good Wednesday, and DFTBA! :) • <a href="mailto:aarsh.shekhar@hotmail.com">Contact me</a></p>
    </footer>

    <aside class="utility-panel" data-menu-panel>
      <a href="../work/">Work</a>
      <a href="../projects/">Projects</a>
      <a href="../research/">Research</a>
      <a href="../blog/">Thoughts</a>
      <a href="../miscellany/">Miscellany</a>
    </aside>

    <aside class="command-panel" data-command-panel>
      <input type="search" placeholder="Search pages..." data-command-input />
      <div class="command-results" data-command-results></div>
    </aside>

    <div class="lightbox" data-lightbox aria-modal="true" role="dialog">
      <button class="lightbox-close" type="button" aria-label="Close photo" data-lightbox-close>×</button>
      <div class="lightbox-inner">
        <img src="../images/photography/photo-01.jpg" alt="" data-lightbox-img />
        <div class="lightbox-copy">
          <h2 data-lightbox-title></h2>
          <p data-lightbox-caption></p>
          <p data-lightbox-meta></p>
        </div>
      </div>
    </div>

    <button class="scroll-top" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">⌃</button>
  </div>
  <script src="../js/photography.js"></script>
</body>
</html>
